<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- RESUMEN DEL ARCHIVO
     Esta página tiene tres partes:
     1) HTML (dentro de body): lo que se ve, o sea el nombre, los botones y las dos listas.
     2) CSS (dentro de style): colores, tamaños y posición de cada cosa.
     3) JavaScript (dentro de script): lo que hace la página. Conecta con Firebase, guarda
        los turnos, ordena las listas y las actualiza en directo en todos los dispositivos.
     Lo único que normalmente hay que editar es la línea DATABASE_URL, en el JavaScript. -->
<!-- Hace que la página se adapte al ancho de la pantalla, en móvil y en ordenador. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Indica que la página admite tema claro y tema oscuro. -->
<meta name="color-scheme" content="light dark">
<title>Turnos de palabra</title>
<!-- Tipos de letra de Google Fonts: Bricolage Grotesque (títulos), Instrument Sans (texto)
     e IBM Plex Mono (números). Si no cargan, el navegador usa una letra del sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;500;600&display=swap">
<!-- ESTILOS (CSS): definen el aspecto de la página. Cada bloque lleva su explicación. -->
<style>
/* Layout: nombre y dos botones arriba; debajo, en paralelo, la lista de intervención directa (ámbar) y la de turnos de palabra. En pantallas estrechas se apilan. */
/* COLORES Y FUENTES (tema claro). Son variables que se reutilizan en toda la página:
   cambiar un valor aquí lo cambia en todas partes.
   --bg fondo de la página, --surface fondo de las tarjetas, --ink texto, --muted texto gris,
   --line líneas y bordes, --accent azul (turnos), --direct ámbar (intervención directa),
   --danger rojo (errores). --f-display, --f-body y --f-mono son los tipos de letra de
   títulos, texto y números. */
:root {
  color-scheme: light;
  --bg: #EEF0F4;
  --surface: #FFFFFF;
  --ink: #12161F;
  --muted: #5B6474;
  --line: #D9DDE5;
  --accent: #2447D8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FD;
  --direct: #FFB800;
  --direct-ink: #1A1300;
  --direct-soft: #FFF0BF;
  --direct-text: #7A5600;
  --danger: #B3261E;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* TEMA OSCURO AUTOMÁTICO: si el dispositivo está en modo oscuro, se usan estos colores
   en lugar de los de arriba. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1117;
    --surface: #161B24;
    --ink: #E7EAF0;
    --muted: #98A1B2;
    --line: #283042;
    --accent: #8CA2FF;
    --accent-ink: #0B1030;
    --accent-soft: #1C2547;
    --direct: #FFC21A;
    --direct-ink: #1A1300;
    --direct-soft: #3B2D04;
    --direct-text: #FFD25A;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
/* Los mismos colores oscuros, para cuando el visor fuerza el tema oscuro a mano. */
:root[data-theme="dark"] {
  --bg: #0E1117;
  --surface: #161B24;
  --ink: #E7EAF0;
  --muted: #98A1B2;
  --line: #283042;
  --accent: #8CA2FF;
  --accent-ink: #0B1030;
  --accent-soft: #1C2547;
  --direct: #FFC21A;
  --direct-ink: #1A1300;
  --direct-soft: #3B2D04;
  --direct-text: #FFD25A;
  --danger: #FF8A80;
  color-scheme: dark;
}

/* REGLAS GENERALES: el tamaño de cada elemento incluye su borde y su relleno (así es más
   fácil calcular anchos). */
*, *::before, *::after { box-sizing: border-box; }
/* Todo lo que lleve el atributo hidden queda oculto (por ejemplo la barra de administrador
   mientras no estés en modo admin). */
[hidden] { display: none !important; }
/* PÁGINA COMPLETA: fondo, color y letra del texto, y 16px de margen a izquierda y derecha
   para que nada toque el borde del móvil. */
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 32px 56px;
}
/* Contenedor central: ancho máximo de 980px, centrado, con 20px entre bloques. */
.wrap { max-width: 980px; margin-inline: auto; display: grid; gap: 20px; }
/* LAS DOS LISTAS EN PARALELO: dos columnas del mismo ancho. Si no caben (300px mínimo
   cada una, como en un móvil) pasan a apilarse una encima de otra. */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
/* Estilo del título principal (h1). Ahora mismo el HTML no lo usa, pero queda por si lo
   vuelves a poner. */
h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1.1;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
/* Estilo del título de cada lista ("Intervención directa" y "Turnos de palabra"). */
h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 20px;
  line-height: 1.15;
}
/* LÍNEA DE ESTADO DE SINCRONIZACIÓN (arriba del todo). Por defecto en gris; el JavaScript
   le añade la clase "ok" (verde) o "bad" (rojo) según el estado. */
.count { margin: 6px 0 0; color: var(--muted); }
/* Verde para el estado "Actualizado" (un tono para el tema claro y otro para el oscuro). */
:root { --ok: #1b7f3b9e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #5fd389b3; } }
:root[data-theme="dark"] { --ok: #5fd389b3; }
/* Si el estado es "Actualizado": verde. */
.count.ok { color: var(--ok); font-weight: 600; }
/* Cualquier otro estado ("Conectando…", "Sin conexión"…): rojo. */
.count.bad { color: var(--danger); font-weight: 600; }

/* TARJETA SUPERIOR: el recuadro blanco que contiene el nombre y los dos botones. */
.panel {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}
/* Formulario: etiqueta, campo y botones uno debajo de otro, con 10px de separación. */
form { display: grid; gap: 10px; }
/* Etiqueta pequeña en mayúsculas encima del campo ("TU NOMBRE"). */
label { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
/* Campo donde se escribe el nombre. La letra de 16px evita que el iPhone haga zoom al
   tocarlo. */
input[type="text"] {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
}
/* Aspecto del campo cuando está bloqueado (cuando ya estás apuntado en alguna lista). */
input[type="text"]:disabled { color: var(--muted); }
/* BOTONES EN GENERAL: misma letra que el resto y cursor de mano. Los botones desactivados
   se ven medio transparentes y no se pueden pulsar. */
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
/* Zona de los dos botones grandes: en dos columnas y, si no caben, uno debajo del otro. */
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
/* Botón grande, azul por defecto ("Pedir Turno"). */
.primary {
  width: 100%;
  min-height: 56px;
  padding: 8px 12px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 17px;
  line-height: 1.15;
  color: var(--accent-ink);
  background: var(--accent);
  border: 2px solid var(--accent);
  border-radius: 10px;
}
/* Cuando ya estás en la lista el botón pasa a "Retirar…" y se ve solo con borde, sin relleno. */
.primary.leave { color: var(--accent); background: transparent; }
/* El botón de "Intervención directa" usa el color ámbar. */
.primary.direct-btn { color: var(--direct-ink); background: var(--direct); border-color: var(--direct); }
.primary.direct-btn.leave { color: var(--direct-text); background: transparent; }
/* Mensaje debajo de los botones (tu posición en las listas, avisos y errores). */
.status { margin: 12px 0 0; min-height: 1.45em; color: var(--muted); font-size: 15px; }
/* Si el mensaje es un error, se ve en rojo. */
.status.error { color: var(--danger); }

/* LISTAS: cada lista es una tarjeta con borde y esquinas redondeadas. */
.block {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
/* Cabecera de cada lista: título a la izquierda y número de personas a la derecha. */
.block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
/* Número de personas que hay en la lista (letra tipo máquina de escribir). */
.num { font-family: var(--f-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* Lista de intervención directa: borde y cabecera en ámbar para que destaque. */
.direct { border: 2px solid var(--direct); }
.direct .block-head { background: var(--direct); color: var(--direct-ink); border-bottom: 0; }
.direct .num { color: var(--direct-ink); }
/* Texto pequeño de ayuda bajo una cabecera. Ahora mismo no se usa en el HTML. */
.hint { margin: 0; padding: 12px 16px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }

/* BARRA DE ADMINISTRADOR de cada lista ("Pasar al siguiente" y "Vaciar lista"). Solo se
   muestra cuando el enlace termina en #admin. */
.adminbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
/* Botones discretos, solo con borde: "Pasar al siguiente", "Vaciar lista" y "Quitar". */
.ghost {
  min-height: 40px;
  padding: 0 14px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
}
/* Aviso en rojo del botón "Vaciar lista" mientras pide confirmación. */
.ghost.warn { color: var(--danger); border-color: var(--danger); }
/* Versión más pequeña, usada para el botón "Quitar" de cada fila. */
.ghost.small { min-height: 32px; padding: 0 10px; font-size: 13px; }

/* FILAS DE LAS LISTAS. Sin numeración automática: los números 1.º, 2.º… los pone el
   JavaScript. */
ol { list-style: none; margin: 0; padding: 0; }
/* Cada fila (una persona): tres columnas, que son posición, nombre y etiquetas o botón. */
.row {
  display: grid;
  grid-template-columns: 2.75rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-top: 1px solid var(--line);
}
/* La primera fila no lleva línea encima. */
.row:first-child { border-top: 0; }
/* La primera persona de cada lista (la que tiene la palabra) se resalta con fondo de color. */
.row.now { background: var(--accent-soft); }
/* Posición de la persona (1.º, 2.º…). */
.pos { font-family: var(--f-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.now .pos { color: var(--accent); }
/* Nombre de la persona. Si es muy largo se parte en varias líneas. */
.who { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
/* El nombre de quien tiene la palabra se ve más grande y en negrita. */
.row.now .who { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.15; }
/* Parte derecha de cada fila, donde van las etiquetas y el botón "Quitar". */
.tags { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
/* Etiquetas pequeñas y redondeadas ("Con la palabra", "Tú"). */
.tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
/* Etiqueta de quien habla ahora (azul). */
.tag.speak { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* Etiqueta "Tú": marca tu propia fila. */
.tag.me { color: var(--accent); border-color: var(--accent); }
/* En la lista de intervención directa, la primera fila y sus etiquetas usan el ámbar. */
.direct .row.now { background: var(--direct-soft); }
.direct .row.now .pos { color: var(--direct-text); }
.direct .tag.speak { background: var(--direct); color: var(--direct-ink); border-color: var(--direct); }
.direct .tag.me { color: var(--direct-text); border-color: var(--direct-text); }
/* Mensaje que se muestra cuando una lista está vacía. Ahora mismo no tiene texto en el
   HTML: puedes escribirlo ahí (por ejemplo "Nadie en la lista"). */
.empty { margin: 0; padding: 22px 16px; color: var(--muted); }

/* MINI VENTANA (solo en modo admin): una pastilla oscura con el número de personas de cada
   lista. Cada número usa el color de su lista: ámbar (intervención directa) y azul (turnos).
   Sus colores son los mismos en tema claro y oscuro. */
:root { --mini-bg: #12161F; --mini-line: #283042; --mini-d: #FFC21A; --mini-t: #8CA2FF; }
/* Cabecera: la línea de estado a la izquierda y el botón de la mini ventana a la derecha. */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.top .count { margin: 0; }
/* Botón de la mini ventana cuando está activada. */
.ghost.on { color: var(--accent); border-color: var(--accent); }
/* La pastilla: dos números separados por una línea fina. */
.mini { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 18px; background: var(--mini-bg); border: 1px solid var(--mini-line); border-radius: 12px; user-select: none; }
.mini-n { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2ch; text-align: center; }
.mini-n.directas { color: var(--mini-d); }
.mini-n.turnos { color: var(--mini-t); }
.mini-sep { width: 1px; align-self: stretch; background: var(--mini-line); }
/* Versión dentro de la página (si el navegador no permite ventana flotante): fija abajo a la
   izquierda y se puede arrastrar. */
.mini-float { position: fixed; left: 16px; bottom: 16px; z-index: 50; cursor: grab; touch-action: none; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.mini-float.drag { cursor: grabbing; }
/* Versión dentro de la ventana flotante del navegador: la pastilla ocupa toda la ventana. */
body.pip { margin: 0; padding: 0; min-height: 100vh; background: var(--mini-bg); display: grid; place-items: center; }
body.pip .mini { width: 100%; height: 100vh; border: 0; border-radius: 0; }

/* Contorno visible al moverse por la página con el teclado. */
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* Transición suave en los botones, solo si el usuario no tiene desactivadas las animaciones. */
@media (prefers-reduced-motion: no-preference) {
  .primary, .ghost { transition: opacity 0.15s ease, background-color 0.15s ease; }
}
/* AJUSTE PARA MÓVILES ESTRECHOS: las etiquetas pasan debajo del nombre. */
@media (max-width: 420px) {
  .row { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .tags { grid-column: 2; justify-content: flex-start; }
}
</style>
</head>
<body>
<!-- CONTENIDO VISIBLE. Todo lo que se ve en pantalla está dentro de este bloque. -->
<main class="wrap">
  <!-- CABECERA: la línea de estado de sincronización ("Conectando…" es el texto inicial; el
       JavaScript lo cambia a "Actualizado", "Sin conexión"… y le pone el color) y, a la
       derecha y solo en modo #admin, el botón que activa o desactiva la mini ventana. -->
  <header class="top">
    <p id="count" class="count bad">Conectando…</p>
    <button id="mini-toggle" type="button" class="ghost" aria-pressed="false" hidden>Activar mini ventana</button>
  </header>

  <!-- TARJETA SUPERIOR: tu nombre y los dos botones. -->
  <section class="panel">
    <!-- Al pulsar Enter en el campo del nombre se pide turno normal (como el botón azul). -->
    <form id="form" autocomplete="off">
      <label for="name">Tu nombre</label>
      <!-- Campo del nombre (máximo 40 letras). El navegador lo recuerda y se bloquea cuando ya
           estás en alguna lista. -->
      <input id="name" type="text" maxlength="40" placeholder="Nombre y apellido" enterkeyhint="go">
      <!-- Los dos botones. Empiezan desactivados (disabled) hasta que la página conecte con el
           servidor. Tu texto se cambia desde el JavaScript (CFG) cuando cambian de función. -->
      <div class="actions">
        <!-- Botón azul: te apunta a la lista "Turnos de palabra", o te quita si ya estás. -->
        <button id="go-turnos" type="button" class="primary" disabled>Pedir Turno</button>
        <!-- Botón ámbar: te apunta a "Intervención directa". Puedes estar en las dos listas a la vez. -->
        <button id="go-directas" type="button" class="primary direct-btn" disabled>Intervención directa</button>
      </div>
    </form>
    <!-- Mensajes para ti: tu posición en las listas, avisos y errores. Con aria-live los
         lectores de pantalla lo leen cuando cambia. -->
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <!-- LAS DOS LISTAS, una al lado de la otra (una encima de la otra en pantallas estrechas). -->
  <div class="cols">
    <!-- LISTA 1: INTERVENCIÓN DIRECTA (ámbar). Se interviene sin esperar los turnos de palabra. -->
    <section class="block direct" aria-labelledby="h-directas">
      <div class="block-head">
        <h2 id="h-directas">Intervención directa</h2>
        <span id="n-directas" class="num"></span>
      </div>
      <!-- Botones de administrador de esta lista, ocultos salvo con #admin. "Pasar al siguiente"
           quita al primero; "Vaciar lista" borra a todos (pide confirmar antes). -->
      <div id="admin-directas" class="adminbar" hidden>
        <button id="next-directas" type="button" class="ghost">Pasar al siguiente</button>
        <button id="clear-directas" type="button" class="ghost">Vaciar lista</button>
      </div>
      <!-- Aquí escribe el JavaScript las filas de la lista, una por persona. -->
      <ol id="list-directas"></ol>
      <!-- Mensaje de lista vacía (ahora sin texto). Solo se ve cuando no hay nadie. -->
      <p id="empty-directas" class="empty" hidden></p>
    </section>

    <!-- LISTA 2: TURNOS DE PALABRA (azul). Funciona igual que la anterior. -->
    <section class="block" aria-labelledby="h-turnos">
      <div class="block-head">
        <h2 id="h-turnos">Turnos de palabra</h2>
        <span id="n-turnos" class="num"></span>
      </div>
      <!-- Botones de administrador de esta lista (solo con #admin). -->
      <div id="admin-turnos" class="adminbar" hidden>
        <button id="next-turnos" type="button" class="ghost">Pasar al siguiente</button>
        <button id="clear-turnos" type="button" class="ghost">Vaciar lista</button>
      </div>
      <!-- Aquí escribe el JavaScript las filas de la lista de turnos. -->
      <ol id="list-turnos"></ol>
      <!-- Mensaje de lista vacía (ahora sin texto). -->
      <p id="empty-turnos" class="empty" hidden></p>
    </section>
  </div>
</main>

<!-- SCRIPT 1, DIAGNÓSTICO: un aviso de seguridad. Está separado del principal para que siga
     funcionando aunque el principal se rompa al editarlo. -->
<script>
/* Avisos de diagnóstico: funcionan aunque el script principal falle al editarlo. */
// Esta función se ejecuta sola al cargar la página. Lo que hay dentro queda aislado del resto.
(function () {
  // Escribe un mensaje de error en la zona de mensajes, en rojo.
  function show(t) {
    var s = document.getElementById('status');
    if (s) { s.textContent = t; s.classList.add('error'); }
  }
  // Si algo falla en el JavaScript (por ejemplo, si al editar se rompe el código), lo muestra
  // en pantalla en vez de dejar la página en "Conectando…".
  window.addEventListener('error', function (e) {
    show('Error en la página: ' + (e && e.message ? e.message : 'desconocido') + '. Si acabas de editar index.html, revisa la línea DATABASE_URL (comillas y punto y coma).');
  });
  // Si pasan 12 segundos y la línea de estado sigue en "Conectando…", avisa de que no se
  // consigue conectar con la base de datos.
  setTimeout(function () {
    var c = document.getElementById('count');
    if (c && c.textContent === 'Conectando…') {
      show('No se consigue conectar con la base de datos. Revisa la URL en index.html y que las reglas estén publicadas.');
    }
  }, 12000);
})();
</script>
<!-- SCRIPT 2, EL PRINCIPAL: la lógica de la página. Se organiza así: configuración, identidad
     anónima, estado, pintado de la página (render), acciones de los botones y, al final, la
     conexión con Firebase. -->
<script>
/* ============ CONFIGURACIÓN ============
   Pega aquí la URL de tu Realtime Database de Firebase (ver LEEME.md, paso 4).
   Empieza por https:// y termina en firebasedatabase.app o firebaseio.com */
// Dirección de tu base de datos de Firebase, que es donde se guardan las listas.
// Sin ella la página no funciona.
var DATABASE_URL = "https://turnos-de-palabra-default-rtdb.europe-west1.firebasedatabase.app/";
/* ====================================== */

// Aquí empieza la lógica de la página, dentro de una función que se ejecuta sola.
(function () {
  // Atajo: $("nombre") busca en la página el elemento que tiene ese id.
  var $ = function (id) { return document.getElementById(id); };
  // Elementos fijos de la página que se usan mucho: campo del nombre, formulario, mensaje
  // de estado y línea de sincronización.
  var els = { name: $('name'), form: $('form'), status: $('status'), count: $('count'), miniBtn: $('mini-toggle') };
  // Claves con las que el navegador recuerda cosas en tu dispositivo: tu nombre (NAME_KEY)
  // y tu identificador anónimo (ID_KEY).
  var NAME_KEY = 'turnos:nombre';
  var ID_KEY = 'turnos:id';
  // Formato permitido para el identificador: letras, números, - y _, de 8 a 40 caracteres.
  // Las reglas de Firebase exigen el mismo formato.
  var ID_RE = /^[A-Za-z0-9_-]{8,40}$/;
  // Nombres de las dos listas. También son los nombres de las dos "carpetas" de la base de
  // datos. Importa el orden: la de intervención directa se pinta primero.
  var KEYS = ['directas', 'turnos'];
  // Textos de cada lista. join = texto del botón para apuntarse, leave = para retirarse,
  // now = etiqueta de quien va el primero. Aquí se editan los textos de botones y etiquetas.
  var CFG = {
    directas: { join: 'Intervención directa', leave: 'Retirar intervención directa', now: 'Tu turno' },
    turnos: { join: 'Pedir turno', leave: 'Retirar turno', now: 'Tu turno' }
  };
  // L guarda toda la información de cada lista: las personas (docs), si ya han cargado
  // (loaded) y sus elementos de la página (botón, lista, mensaje vacío, barra de admin).
  var L = {};
  KEYS.forEach(function (k) {
    L[k] = {
      key: k, cfg: CFG[k], docs: [], loaded: false, confirmClear: false, timer: null,
      btn: $('go-' + k), list: $('list-' + k), empty: $('empty-' + k), admin: $('admin-' + k),
      next: $('next-' + k), clear: $('clear-' + k), num: $('n-' + k)
    };
  });

  // IDENTIDAD ANÓNIMA. No hay cuentas: cada navegador crea un código aleatorio y lo guarda.
  // Con ese código el servidor sabe cuál es "tu" fila en cada lista.
  var memId = null;
  // Crea un código aleatorio nuevo.
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var c = 'abcdefghijklmnopqrstuvwxyz0123456789', s = '';
    for (var i = 0; i < 24; i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return s;
  }
  // Devuelve tu código; si no existe, lo crea y lo guarda en el navegador. Si el navegador
  // no deja guardar (modo privado), lo mantiene solo mientras la página esté abierta.
  function getId() {
    try {
      var v = localStorage.getItem(ID_KEY);
      if (v && ID_RE.test(v)) return v;
      v = newId();
      localStorage.setItem(ID_KEY, v);
      return v;
    } catch (e) {
      return memId || (memId = newId());
    }
  }
  // Leer (lsGet) y guardar (lsSet) tu nombre en el navegador, para no escribirlo cada vez.
  // Si el navegador lo impide, se ignora sin errores.
  function lsGet() { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } }
  function lsSet(v) { try { localStorage.setItem(NAME_KEY, v); } catch (e) {} }
  // MODO ADMIN: devuelve verdadero si el enlace termina exactamente en #admin. Eso es lo
  // que hace aparecer los botones de administrador.
  function checkAdmin() { return /^#admin$/i.test(location.hash); }
  // Convierte un número en posición: 1 pasa a "1.º".
  function ordinal(n) { return n + '.º'; }

  // ESTADO: variables que describen cómo está la página en cada momento.
  // uid = tu identificador, isAdmin = si estás en modo admin, setup = falta configurar la
  // URL, failed = no cargó Firebase, connected = hay conexión con el servidor, busy = hay
  // una acción en curso (evita pulsar dos veces), msg y msgError = mensaje a mostrar,
  // db y api = la conexión con Firebase.
  var state = {
    uid: getId(), isAdmin: checkAdmin(), setup: false, failed: false, connected: false,
    busy: false, msg: '', msgError: false, db: null, api: null
  };

  // Estado de la mini ventana: on = activada, pip = ventana flotante del navegador, box =
  // recuadro dentro de la página, y los "refs" son los elementos donde se escriben los números.
  var mini = { on: false, pip: null, pipRefs: null, box: null, boxRefs: null };
  var MINI_TITLES = { directas: 'Intervención directa', turnos: 'Turnos de palabra' };
  var MINI_NOTE = 'Este navegador no permite una ventana flotante fuera de la página: el recuadro se muestra dentro de ella.';

  // Traduce los errores técnicos a un mensaje que se entienda.
  function errText(e) {
    var code = e && e.code;
    if (code === 'PERMISSION_DENIED' || code === 'permission-denied') return 'No se pudo guardar. Comprueba que las reglas de la base de datos están publicadas (LEEME.md, paso 3).';
    return 'No se pudo completar la acción. Comprueba tu conexión e inténtalo de nuevo.';
  }

  // Muestra un mensaje en la zona de estado y repinta la página.
  function setMsg(text, isError) { state.msg = text || ''; state.msgError = !!isError; render(); }

  // Busca tu posición en una lista (0 es la primera). Devuelve -1 si no estás en ella.
  function mineIndex(l) {
    for (var i = 0; i < l.docs.length; i++) if (l.docs[i].id === state.uid) return i;
    return -1;
  }

  // Dice si se puede pulsar: solo cuando está configurado, no hay fallos, la lista ya ha
  // cargado y hay conexión con el servidor.
  function canAct(l) {
    return !state.setup && !state.failed && !!state.db && l.loaded && state.connected;
  }

  // Calcula el mensaje de ayuda según la situación: falta configurar, error de carga o tu
  // posición en cada lista.
  function derivedMsg() {
    if (state.setup) return 'Falta configurar la base de datos. Sigue los pasos del archivo LEEME.md.';
    if (state.failed) return 'No se pudo cargar el servicio de datos. Comprueba tu conexión y recarga la página.';
    var parts = [];
    var md = mineIndex(L.directas), mt = mineIndex(L.turnos);
    if (md >= 0) parts.push(md === 0 ? 'Intervención directa: te toca.' : 'Intervención directa: posición ' + ordinal(md + 1) + '.');
    if (mt >= 0) parts.push(mt === 0 ? 'Turno de palabra: te toca.' : 'Turno de palabra: posición ' + ordinal(mt + 1) + '.');
    if (parts.length) return parts.join(' ');
  }

  // PINTAR UNA LISTA: borra las filas y las vuelve a crear desde los datos. Cada fila lleva
  // posición, nombre, la etiqueta del primero, la etiqueta "Tú" en tu fila y el botón "Quitar"
  // si eres admin. También actualiza el contador y los botones de administrador.
  function renderList(l) {
    var n = l.docs.length;
    l.list.textContent = '';
    l.docs.forEach(function (d, i) {
      var li = document.createElement('li');
      li.className = 'row' + (i === 0 ? ' now' : '');
      var pos = document.createElement('span');
      pos.className = 'pos';
      pos.textContent = ordinal(i + 1);
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = d.name;
      var tags = document.createElement('span');
      tags.className = 'tags';
      if (i === 0) {
        var t1 = document.createElement('span');
        t1.className = 'tag speak';
        t1.textContent = l.cfg.now;
        tags.appendChild(t1);
      }
      if (d.id === state.uid) {
        var t2 = document.createElement('span');
        t2.className = 'tag me';
        t2.textContent = 'Tú';
        tags.appendChild(t2);
      }
      if (state.isAdmin) {
        var rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'ghost small';
        rm.textContent = 'Quitar';
        rm.setAttribute('aria-label', 'Quitar a ' + d.name);
        rm.disabled = state.busy || !canAct(l);
        rm.addEventListener('click', function () { removeDoc(l, d.id); });
        tags.appendChild(rm);
      }
      li.appendChild(pos);
      li.appendChild(who);
      li.appendChild(tags);
      l.list.appendChild(li);
    });
    l.empty.hidden = n > 0 || !l.loaded;
    l.num.textContent = l.loaded ? String(n) : '';
    l.admin.hidden = !state.isAdmin;
    l.next.disabled = state.busy || n === 0 || !canAct(l);
    l.clear.disabled = state.busy || n === 0 || !canAct(l);
    l.clear.textContent = l.confirmClear ? 'Confirmar: vaciar lista' : 'Vaciar lista';
    l.clear.classList.toggle('warn', l.confirmClear);
  }

  // PINTAR TODA LA PÁGINA. Se llama cada vez que algo cambia (datos nuevos, conexión, botón
  // pulsado). Actualiza la línea de estado, el campo de nombre, los botones, las listas y
  // el mensaje.
  function render() {
    // Texto de la línea de estado de arriba, según la situación (se evalúa en este orden).
    var allLoaded = KEYS.every(function (k) { return L[k].loaded; });
    if (state.setup) els.count.textContent = 'Sin configurar';
    else if (state.failed) els.count.textContent = 'Sin conexión';
    else if (!allLoaded) els.count.textContent = 'Conectando…';
    else if (!state.connected) els.count.textContent = 'Sin conexión. Reconectando…';
    else els.count.textContent = 'Actualizado';
    // Verde si pone "Actualizado"; rojo en cualquier otro caso.
    var isOk = els.count.textContent === 'Actualizado';
    els.count.classList.toggle('ok', isOk);
    els.count.classList.toggle('bad', !isOk);

    // Si ya estás en alguna lista, muestra tu nombre en el campo y lo bloquea.
    var mt = mineIndex(L.turnos), md = mineIndex(L.directas);
    var any = mt >= 0 || md >= 0;
    if (mt >= 0) els.name.value = L.turnos.docs[mt].name;
    else if (md >= 0) els.name.value = L.directas.docs[md].name;
    els.name.disabled = any || state.setup || state.failed;

    // Para cada lista: actualiza su botón (activado o no, y su texto: apuntarse o retirarse)
    // y vuelve a pintar sus filas.
    KEYS.forEach(function (k) {
      var l = L[k], mine = mineIndex(l) >= 0;
      l.btn.disabled = state.busy || !canAct(l);
      l.btn.textContent = mine ? l.cfg.leave : l.cfg.join;
      l.btn.classList.toggle('leave', mine);
      renderList(l);
    });

    // Mensaje de ayuda o de error debajo de los botones (en rojo si es un error).
    els.status.textContent = state.msg || derivedMsg();
    els.status.classList.toggle('error', state.setup || state.failed || (!!state.msg && state.msgError));

    // Botón de la mini ventana (solo se ve en modo admin) y números de la mini ventana.
    els.miniBtn.hidden = !state.isAdmin;
    els.miniBtn.textContent = mini.on ? 'Desactivar mini ventana' : 'Activar mini ventana';
    els.miniBtn.setAttribute('aria-pressed', mini.on ? 'true' : 'false');
    els.miniBtn.classList.toggle('on', mini.on);
    updateMini();
  }

  // APUNTARSE A UNA LISTA: comprueba que hay nombre y guarda en la base de datos tu nombre
  // y la hora de pulsado.
  async function claim(l) {
    var name = els.name.value.replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!name) { setMsg('Escribe tu nombre para participar.', true); els.name.focus(); return; }
    state.busy = true; state.msg = ''; render();
    try {
      if (mineIndex(l) < 0) {
        // La hora de pulsado la pone el servidor, así el orden no depende del reloj de cada dispositivo.
        await state.api.set(state.api.ref(state.db, l.key + '/' + state.uid), {
          name: name, createdAt: state.api.serverTimestamp()
        });
        lsSet(name);
      }
    } catch (e) {
      state.msg = errText(e); state.msgError = true;
    } finally {
      state.busy = false; render();
    }
  }

  // QUITAR A UNA PERSONA de una lista: tú mismo con "Retirar", o el admin con "Quitar" o
  // "Pasar al siguiente".
  async function removeDoc(l, id) {
    if (!state.db || state.busy) return;
    state.busy = true; state.msg = ''; render();
    try { await state.api.remove(state.api.ref(state.db, l.key + '/' + id)); }
    catch (e) { state.msg = errText(e); state.msgError = true; }
    finally { state.busy = false; render(); }
  }

  // VACIAR LISTA (admin): la primera pulsación pide confirmar (durante 4 segundos); la
  // segunda borra a todos, uno a uno.
  async function clearAll(l) {
    if (!state.db || state.busy) return;
    if (!l.confirmClear) {
      l.confirmClear = true; render();
      l.timer = setTimeout(function () { l.confirmClear = false; render(); }, 4000);
      return;
    }
    clearTimeout(l.timer);
    l.confirmClear = false;
    state.busy = true; state.msg = ''; render();
    try {
      var ids = l.docs.map(function (d) { return d.id; });
      for (var i = 0; i < ids.length; i++) await state.api.remove(state.api.ref(state.db, l.key + '/' + ids[i]));
    } catch (e) {
      state.msg = errText(e); state.msgError = true;
    } finally {
      state.busy = false; render();
    }
  }

  // Un solo botón por lista hace de "apuntarse" o de "retirarse", según si ya estás dentro.
  function toggle(l) {
    if (state.busy || !canAct(l)) return;
    if (mineIndex(l) >= 0) removeDoc(l, state.uid); else claim(l);
  }

  // MINI VENTANA (solo admin). Muestra únicamente el número de personas de cada lista, cada
  // número con el color de su lista. Hay dos formas de mostrarla:
  // 1) Ventana flotante del navegador (Chrome y Edge de escritorio): se queda visible encima
  //    de todo aunque minimices o cambies de página, y se arrastra como cualquier ventana.
  // 2) Si el navegador no lo permite, un recuadro dentro de la página (abajo a la izquierda)
  //    que también se arrastra, pero que no se ve si minimizas la página.
  // Los navegadores solo dejan abrir la ventana flotante al pulsar un botón, por eso no se
  // abre sola al cargar la página.

  // Crea la pastilla con los dos números en el documento indicado (la página o la ventana
  // flotante) y devuelve dónde escribir cada número.
  function createMini(doc) {
    var root = doc.createElement('div');
    root.className = 'mini';
    root.setAttribute('role', 'group');
    root.setAttribute('aria-label', 'Personas en cada lista');
    var refs = {};
    KEYS.forEach(function (k, i) {
      if (i > 0) {
        var sep = doc.createElement('span');
        sep.className = 'mini-sep';
        root.appendChild(sep);
      }
      var n = doc.createElement('span');
      n.className = 'mini-n ' + k;
      n.title = MINI_TITLES[k];
      root.appendChild(n);
      refs[k] = n;
    });
    return { root: root, refs: refs };
  }

  // Escribe en la mini ventana el número de personas de cada lista ("–" mientras no han cargado).
  function updateMini() {
    [mini.boxRefs, mini.pipRefs].forEach(function (refs) {
      if (!refs) return;
      KEYS.forEach(function (k) {
        var l = L[k], t = l.loaded ? String(l.docs.length) : '–';
        refs[k].textContent = t;
        refs[k].setAttribute('aria-label', MINI_TITLES[k] + ': ' + t);
      });
    });
  }

  // Copia los estilos de la página a la ventana flotante, para que se vea igual.
  function copyStyles(doc) {
    Array.prototype.forEach.call(document.styleSheets, function (sheet) {
      try {
        var css = Array.prototype.map.call(sheet.cssRules, function (r) { return r.cssText; }).join('\n');
        var st = doc.createElement('style');
        st.textContent = css;
        doc.head.appendChild(st);
      } catch (e) {
        // Las hojas de otros sitios (los tipos de letra) no se pueden leer: se enlazan.
        if (sheet.href) {
          var lk = doc.createElement('link');
          lk.rel = 'stylesheet';
          lk.href = sheet.href;
          doc.head.appendChild(lk);
        }
      }
    });
  }

  // Permite arrastrar el recuadro de la página con el ratón o el dedo.
  function enableDrag(el) {
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    el.addEventListener('pointerdown', function (e) {
      var r = el.getBoundingClientRect();
      dragging = true; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      el.classList.add('drag');
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var x = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, ox + e.clientX - sx));
      var y = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, oy + e.clientY - sy));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.bottom = 'auto';
    });
    function end() { dragging = false; el.classList.remove('drag'); }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // ACTIVAR la mini ventana: primero intenta la ventana flotante del navegador y, si no se
  // puede, usa el recuadro dentro de la página.
  async function openMini() {
    if (window.documentPictureInPicture) {
      try {
        var pip = await window.documentPictureInPicture.requestWindow({ width: 50, height: 60, disallowReturnToOpener: true });
        copyStyles(pip.document);
        pip.document.documentElement.lang = 'es';
        pip.document.body.className = 'pip';
        var m = createMini(pip.document);
        pip.document.body.appendChild(m.root);
        mini.pip = pip;
        mini.pipRefs = m.refs;
        // Si cierras la ventana flotante con su propia X, la mini ventana pasa a desactivada.
        pip.addEventListener('pagehide', function () {
          if (mini.pip !== pip) return;
          mini.pip = null; mini.pipRefs = null; mini.on = false;
          render();
        });
        mini.on = true;
        render();
        return;
      } catch (e) {
        // No se pudo abrir la ventana flotante: se usa el recuadro de la página.
      }
    }
    if (!mini.box) {
      var b = createMini(document);
      b.root.classList.add('mini-float');
      document.body.appendChild(b.root);
      enableDrag(b.root);
      mini.box = b.root;
      mini.boxRefs = b.refs;
    }
    // Vuelve a su sitio de origen (abajo a la izquierda) cada vez que se activa.
    mini.box.style.left = '';
    mini.box.style.top = '';
    mini.box.style.bottom = '';
    mini.box.hidden = false;
    mini.on = true;
    setMsg(MINI_NOTE, false);
  }

  // DESACTIVAR la mini ventana: cierra la ventana flotante y oculta el recuadro de la página.
  function closeMini() {
    var p = mini.pip;
    mini.pip = null; mini.pipRefs = null;
    if (p) { try { p.close(); } catch (e) {} }
    if (mini.box) mini.box.hidden = true;
    mini.on = false;
    if (state.msg === MINI_NOTE) state.msg = '';
    render();
  }

  // Un solo botón activa o desactiva la mini ventana.
  function toggleMini() {
    if (mini.on) closeMini(); else openMini();
  }

  // CONEXIÓN DE LOS BOTONES: asocia cada botón con su acción al hacer clic (apuntarse o
  // retirarse, pasar al siguiente, vaciar lista).
  KEYS.forEach(function (k) {
    var l = L[k];
    l.btn.addEventListener('click', function () { toggle(l); });
    l.next.addEventListener('click', function () { if (l.docs.length) removeDoc(l, l.docs[0].id); });
    l.clear.addEventListener('click', function () { clearAll(l); });
  });
  // Pulsar Enter en el campo del nombre equivale a pulsar "Pedir Turno".
  els.form.addEventListener('submit', function (ev) { ev.preventDefault(); toggle(L.turnos); });
  // Botón de la mini ventana (arriba a la derecha, solo en modo admin).
  els.miniBtn.addEventListener('click', toggleMini);
  els.miniBtn.title = window.documentPictureInPicture
    ? 'Abre una ventana pequeña que se queda visible aunque minimices la página'
    : 'Tu navegador no permite ventana flotante: se mostrará un recuadro dentro de la página';
  // Si cambia el final del enlace (#admin) con la página abierta, el modo admin se activa o
  // se desactiva al instante.
  // Si sales del modo admin, la mini ventana se cierra.
  window.addEventListener('hashchange', function () { state.isAdmin = checkAdmin(); if (!state.isAdmin) closeMini(); render(); });

  // ARRANQUE: rellena el nombre guardado y pinta la página por primera vez (aún sin datos).
  els.name.value = lsGet();
  render();

  // CONEXIÓN CON FIREBASE. Se ejecuta al cargar la página: 1) comprueba que la URL es válida,
  // 2) descarga las librerías de Firebase y 3) se suscribe en directo a la conexión y a las
  // dos listas. Cada cambio de cualquier persona llega aquí al instante y la página se
  // repinta.
  (async function init() {
    // Formato aceptado para la URL de la base de datos.
    var URL_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)\/?$/i;
    // Si la URL no es válida (por ejemplo, no se ha pegado), se muestra "Sin configurar".
    if (!URL_RE.test(DATABASE_URL)) { state.setup = true; render(); return; }
    try {
      // Carpeta de Google desde la que se descargan las librerías de Firebase (versión 10.14.1).
      var base = 'https://www.gstatic.com/firebasejs/10.14.1/';
      var A = await import(base + 'firebase-app.js');
      var D = await import(base + 'firebase-database.js');
      // Inicia Firebase con tu URL y se conecta a la base de datos.
      var app = A.initializeApp({ databaseURL: DATABASE_URL });
      state.db = D.getDatabase(app);
      state.api = { ref: D.ref, set: D.set, remove: D.remove, serverTimestamp: D.serverTimestamp };

      // Aviso en directo de si hay conexión con el servidor. Alimenta el estado verde o rojo.
      D.onValue(D.ref(state.db, '.info/connected'), function (s) {
        state.connected = s.val() === true;
        render();
      });
      // Para cada lista, escucha los cambios en directo: cada vez que alguien se apunta o se
      // retira, llega la lista completa.
      KEYS.forEach(function (k) {
        var l = L[k];
        D.onValue(D.ref(state.db, k), function (snap) {
          var v = snap.val() || {};
          // Convierte los datos en una lista de personas (id, nombre y hora) y la ordena por hora
          // de pulsado: el primero que pulsó va primero. Si dos coinciden, desempata por id.
          l.docs = Object.keys(v).map(function (id) {
            var x = v[id] || {};
            return { id: id, name: String(x.name || 'Sin nombre'), at: Number(x.createdAt) || 0 };
          }).sort(function (a, b) { return (a.at - b.at) || (a.id < b.id ? -1 : 1); });
          l.loaded = true;
          render();
        }, function (e) {
          state.msg = errText(e); state.msgError = true; l.loaded = true; render();
        });
      });
    } catch (e) {
      // Si no se pueden descargar las librerías (sin internet o bloqueadas), se marca como
      // fallo y se avisa.
      state.failed = true; render();
    }
  })();
})();
</script>
</body>
</html>
